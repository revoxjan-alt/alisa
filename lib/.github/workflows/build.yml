name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android papkasini yaratish
        run: |
          flutter create --platforms=android --project-name alisa_uz --org uz.alisa /tmp/gen
          cp -r /tmp/gen/android ./android

      - name: Manifestga ruxsatlarni qo'shish
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><application#' $M
          sed -i 's#<queries>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent>#' $M
          sed -i 's#android:label="[^"]*"#android:label="Alisa"#' $M
          cat $M

      - run: flutter pub get

      - name: APK yig'ish
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: alisa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
